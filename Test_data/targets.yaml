detection_target:
  name: bat
  match_if:
    name: all_of
    conditions:
      - name: has_tag
        tag: { key: event, value: Echolocation }
      - name: not
        condition:
          name: has_tag
          tag: { key: class, value: Unknown }
  assign_tags:
    - key: class
      value: Bat

classification_targets:
  - name: hiparm
    tags:
      - key: class
        value: Hipposideros armiger
  - name: hyppul
    tags:
      - key: class
        value: Hypsugo pulveratus        
  - name: myohor
    tags:
      - key: class
        value: Myotis horsfieldii
  - name: pipabr
    tags:
      - key: class
        value: Pipistrellus abramus        
  - name: pipten
    tags:
      - key: class
        value: Pipistrellus tenuis
  - name: tylful
    tags:
      - key: class
        value: Tylonycteris fulvida

roi:
  default:
    name: anchor_bbox
    anchor: bottom-left
