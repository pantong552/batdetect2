detection_target:
  name: bat
  match_if:
    name: all_of
    conditions:
      - name: has_tag
        tag: { key: event, value: Echolocation }
      - name: not
        condition:
          name: has_tag
          tag: { key: class, value: Unknown }
  assign_tags:
    - key: class
      value: Bat

classification_targets:
  - name: myohor
    tags:
      - key: class
        value: Myotis horsfieldii

roi:
  default:
    name: anchor_bbox
    anchor: bottom-left
